[project]
name = "kilnbase-auth"
version = "0.0.0"
description = "Kilnbase auth service"
license = "Apache-2.0"
requires-python = ">=3.15"
dependencies = [
    "argon2-cffi==25.1.0",
    "asyncpg==0.32.0",
    "fastapi==0.162.0",
    "httpx2==2.16.0",
    "pyjwt[crypto]==2.15.1",
    "pyotp==2.10.0",
    "signxml==4.4.0",
    "uvicorn[standard]==0.54.0",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"
