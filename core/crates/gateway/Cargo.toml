[package]
name = "kilnbase-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "kilnbase-core"
path = "src/main.rs"

[dependencies]
aws-lc-rs = "1.18.2"
base64 = "0.22.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio", "json", "query", "ws"] }
deadpool-postgres = "0.14.2"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util", "sync", "time"] }
tokio-postgres = "0.7.18"
tower-http = { version = "0.7.1", features = ["cors"] }
tokio-util = { version = "0.7.20", features = ["io"] }
uuid = { version = "1.29.0", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
# PEM parsing is only needed to sign test tokens.
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
