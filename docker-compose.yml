name: kilnbase

services:
  db:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run `kilnbase init` first}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10

  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    image: ghcr.io/varp0s/kilnbase-auth:dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      KILNBASE_JWT_PRIVATE_JWK: ${KILNBASE_JWT_PRIVATE_JWK:?run `kilnbase init` first}
      KILNBASE_AUTHENTICATOR_PASSWORD: ${KILNBASE_AUTHENTICATOR_PASSWORD:?run `kilnbase init` first}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9999/health')"]
      interval: 5s
      retries: 20
    depends_on:
      db:
        condition: service_healthy

  postgrest:
    image: postgrest/postgrest:v16.5
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${KILNBASE_AUTHENTICATOR_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${KILNBASE_JWKS}
      PGRST_OPENAPI_MODE: follow-privileges
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      auth:
        condition: service_healthy

  core:
    build: ./core
    image: ghcr.io/varp0s/kilnbase-core:dev
    restart: unless-stopped
    environment:
      KILNBASE_JWKS: ${KILNBASE_JWKS:?run `kilnbase init` first}
      KILNBASE_DATABASE_URL: postgres://authenticator:${KILNBASE_AUTHENTICATOR_PASSWORD}@db:5432/postgres
      KILNBASE_STORAGE_SIGNING_KEY: ${KILNBASE_STORAGE_SIGNING_KEY:?run `kilnbase init` first}
    volumes:
      - storage-data:/data
    ports:
      - "8000:8000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      - auth
      - postgrest

volumes:
  db-data:
  storage-data:
