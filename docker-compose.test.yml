# Test-only additions: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d
services:
  oauth-mock:
    image: python:3.15.1-slim-trixie
    command: ["python", "/mock/oauth_mock.py"]
    volumes:
      - ./tests/oauth_mock.py:/mock/oauth_mock.py:ro
    ports:
      - "9100:9100"

  # A second auth instance on the same database with MFA required, reached directly by test_mfa.py.
  auth-mfa:
    extends:
      file: docker-compose.yml
      service: auth
    environment:
      KILNBASE_AUTH_MFA_REQUIRED: "true"
      KILNBASE_AUTH_ANONYMOUS: "true"
    ports:
      - "9998:9999"

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "8025:8025"

  auth:
    environment:
      KILNBASE_SMTP_URL: smtp://mailpit:1025
      # Every e2e sign-up sends mail from one IP; the per-address limits are still exercised.
      KILNBASE_AUTH_MAILS_PER_IP_HOUR: "10000"
      KILNBASE_AUTH_ANONYMOUS: "true"
      KILNBASE_OAUTH_MOCK_CLIENT_ID: mock-client
      KILNBASE_OAUTH_MOCK_CLIENT_SECRET: mock-secret
      # The browser (the test) reaches the provider on localhost; the auth service uses the network name.
      KILNBASE_OAUTH_MOCK_AUTHORIZE_URL: http://localhost:9100/authorize
      KILNBASE_OAUTH_MOCK_TOKEN_URL: http://oauth-mock:9100/token
      KILNBASE_OAUTH_MOCK_USERINFO_URL: http://oauth-mock:9100/userinfo
      KILNBASE_AUTH_REDIRECT_URLS: http://localhost:3000

  core:
    environment:
      KILNBASE_IMGPROXY_URL: http://imgproxy:8080
      KILNBASE_FUNCTIONS_URL: http://functions:9000
      KILNBASE_GRAPHQL_URL: http://graphql:4000
      # Test-only key pair, used by tests/e2e/test_s3.py.
      KILNBASE_S3_ACCESS_KEY_ID: e2e-s3-key
      KILNBASE_S3_SECRET_ACCESS_KEY: e2e-s3-secret-0123456789abcdef0123456789

  imgproxy:
    profiles: !reset []

  studio:
    profiles: !reset []

  functions:
    profiles: !reset []
    environment:
      KILNBASE_FUNCTIONS_TIMEOUT: "3"
    volumes: !override
      - ./tests/functions:/functions:ro
      - functions-deps:/deps

  graphql:
    profiles: !reset []
