[tool.uv.workspace]
members = ["auth", "cli"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx2==2.16.0",
    "ruff==0.17.2",
    "websockets==17.3",
    "boto3==1.43.118",
]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["auth/tests", "cli/tests", "sdk/python/tests", "tests/e2e"]
# The Python SDK is not a workspace member (its distribution name differs from the CLI's).
pythonpath = ["sdk/python/src"]
