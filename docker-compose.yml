name: kilnbase

services:
  db:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run `kilnbase init` first}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10

  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    image: ghcr.io/varp0s/kilnbase-auth:dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      KILNBASE_JWT_PRIVATE_JWK: ${KILNBASE_JWT_PRIVATE_JWK:?run `kilnbase init` first}
      KILNBASE_AUTHENTICATOR_PASSWORD: ${KILNBASE_AUTHENTICATOR_PASSWORD:?run `kilnbase init` first}
      # Public address of the gateway; provider callbacks go to <this>/auth/v1/callback.
      KILNBASE_PUBLIC_URL: ${KILNBASE_PUBLIC_URL:-http://localhost:8000}
      # Comma-separated app URLs that sign-in may redirect back to.
      KILNBASE_AUTH_REDIRECT_URLS: ${KILNBASE_AUTH_REDIRECT_URLS:-}
      # Passwordless sign-in mail; without it codes are printed to the auth log (development only).
      KILNBASE_SMTP_URL: ${KILNBASE_SMTP_URL:-}
      KILNBASE_SMTP_FROM: ${KILNBASE_SMTP_FROM:-}
      # Emails (codes, links, confirmations) one client IP may trigger per hour.
      KILNBASE_AUTH_MAILS_PER_IP_HOUR: ${KILNBASE_AUTH_MAILS_PER_IP_HOUR:-30}
      # Allow POST /auth/v1/anonymous (guest users that can later add an email and password).
      KILNBASE_AUTH_ANONYMOUS: ${KILNBASE_AUTH_ANONYMOUS:-false}
      # Every non-guest user must enrol and verify a second factor before using the APIs.
      KILNBASE_AUTH_MFA_REQUIRED: ${KILNBASE_AUTH_MFA_REQUIRED:-false}
      # A provider is enabled when its client ID is set.
      KILNBASE_OAUTH_GITHUB_CLIENT_ID: ${KILNBASE_OAUTH_GITHUB_CLIENT_ID:-}
      KILNBASE_OAUTH_GITHUB_CLIENT_SECRET: ${KILNBASE_OAUTH_GITHUB_CLIENT_SECRET:-}
      KILNBASE_OAUTH_GOOGLE_CLIENT_ID: ${KILNBASE_OAUTH_GOOGLE_CLIENT_ID:-}
      KILNBASE_OAUTH_GOOGLE_CLIENT_SECRET: ${KILNBASE_OAUTH_GOOGLE_CLIENT_SECRET:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9999/health')"]
      interval: 5s
      retries: 20
    depends_on:
      db:
        condition: service_healthy

  postgrest:
    image: postgrest/postgrest:v16.5
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${KILNBASE_AUTHENTICATOR_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${KILNBASE_JWKS}
      PGRST_OPENAPI_MODE: follow-privileges
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      auth:
        condition: service_healthy

  core:
    build: ./core
    image: ghcr.io/varp0s/kilnbase-core:dev
    restart: unless-stopped
    environment:
      KILNBASE_JWKS: ${KILNBASE_JWKS:?run `kilnbase init` first}
      KILNBASE_DATABASE_URL: postgres://authenticator:${KILNBASE_AUTHENTICATOR_PASSWORD}@db:5432/postgres
      KILNBASE_STORAGE_SIGNING_KEY: ${KILNBASE_STORAGE_SIGNING_KEY:?run `kilnbase init` first}
      # Comma-separated list of allowed browser origins, or * for any.
      KILNBASE_CORS_ORIGINS: ${KILNBASE_CORS_ORIGINS:-*}
      # Image transformations: set to http://imgproxy:8080 and start with COMPOSE_PROFILES=images.
      KILNBASE_IMGPROXY_URL: ${KILNBASE_IMGPROXY_URL:-}
    volumes:
      - storage-data:/data
    ports:
      - "8000:8000"
    networks: [default, images]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      - auth
      - postgrest

  # Optional; core authorizes every request and imgproxy only reads stored objects. It sits on an
  # internal network that only core joins, which is why its URLs are unsigned.
  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v4.0.19
    profiles: [images]
    restart: unless-stopped
    environment:
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /data
      IMGPROXY_ALLOWED_SOURCES: local://
      IMGPROXY_MAX_SRC_RESOLUTION: "50"
      IMGPROXY_MAX_RESULT_DIMENSION: "2500"
    volumes:
      - storage-data:/data:ro
    networks: [images]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  images:
    internal: true

volumes:
  db-data:
  storage-data:
