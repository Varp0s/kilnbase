[project]
name = "kilnbase"
version = "0.0.0"
description = "Kilnbase command line: init, migrate, doctor, upgrade"
license = "Apache-2.0"
requires-python = ">=3.15"
dependencies = [
    "pyjwt[crypto]==2.15.1",
]

[project.scripts]
kilnbase = "kilnbase_cli.main:main"

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kilnbase_cli"
