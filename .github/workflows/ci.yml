name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: core
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          manifest-path: core/Cargo.toml

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json
      - run: npm ci
      - run: npm test

  smoke:
    runs-on: ubuntu-latest
    needs: [rust, python, sdk]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv run kilnbase init
      - run: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build --wait
      - name: health checks
        run: |
          curl -fsS --retry 10 --retry-all-errors --retry-delay 2 localhost:8000/health
          docker compose exec -T auth python -c "import urllib.request; urllib.request.urlopen('http://localhost:9999/health')"
      # Fails fast with the runner's own log; later suites recreate containers and lose it.
      - name: a function runs in its sandbox
        run: |
          set -a; . ./.env; set +a
          debug() {
            docker compose -f docker-compose.yml -f docker-compose.test.yml exec -T functions sh -c '
              ls -lan /functions /functions/whoami; cat /proc/self/mountinfo | grep -E "functions|deps| /tmp"
              cd /app && .venv/bin/python -c "
          import os, sys
          from pathlib import Path
          from kilnbase_functions import jail
          from kilnbase_functions.config import load
          c = load(os.environ)
          a = [x for x in jail.argv(c, Path(\"/functions/whoami\"), 1) if x != \"-Q\"]
          os.execvp(a[0], a[:1] + [\"-v\"] + a[1:])
          " </dev/null' 2>&1 | tail -60
          }
          curl -fsS localhost:8000/functions/v1/whoami -H "apikey: $KILNBASE_ANON_KEY"             || { docker compose -f docker-compose.yml -f docker-compose.test.yml logs functions; debug; exit 1; }
      # Before the e2e suite: test_gen_types_db type-checks generated output with the SDK's tsc.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: npm ci
        working-directory: sdk/js
      - name: end-to-end tests
        env:
          KILNBASE_E2E: "1"
        run: uv run pytest tests/e2e -q
      - name: doctor finds no blocking problems after the suite
        run: uv run kilnbase doctor
      - name: SDK end-to-end tests
        working-directory: sdk/js
        run: npm run test:e2e
      - name: services refuse example secrets
        run: |
          for img in kilnbase-core kilnbase-auth kilnbase-studio kilnbase-functions kilnbase-graphql; do
            if docker run --rm --env-file .env.example ghcr.io/varp0s/$img:dev; then
              echo "$img started with example secrets"; exit 1
            fi
          done
      - if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml logs
