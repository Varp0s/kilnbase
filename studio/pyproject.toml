[project]
name = "kilnbase-studio"
version = "0.0.0"
description = "Kilnbase Studio: admin dashboard (optional service)"
license = "Apache-2.0"
requires-python = ">=3.15"
dependencies = [
    "asyncpg==0.32.0",
    "fastapi==0.162.0",
    "kilnbase-auth",
    "pyjwt[crypto]==2.15.1",
    "uvicorn[standard]==0.54.0",
]

[tool.uv.sources]
# Shares the access-token claims and the log format with the auth service, never its key.
kilnbase-auth = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"
