name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    strategy:
      matrix:
        include:
          - name: kilnbase-core
            context: core
            dockerfile: core/Dockerfile
          - name: kilnbase-auth
            context: .
            dockerfile: auth/Dockerfile
          - name: kilnbase-postgres
            context: postgres
            dockerfile: postgres/Dockerfile
          - name: kilnbase-studio
            context: .
            dockerfile: studio/Dockerfile
    steps:
      - uses: actions/checkout@v7.0.1
      - run: scripts/release-gate.sh
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1

      # Build for the runner first so the gate can inspect the exact filesystem we ship.
      - uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.name }}:gate
      - run: scripts/release-gate.sh --images ${{ matrix.name }}:gate

      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/varp0s/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v4.1.2
      - run: cosign sign --yes ghcr.io/varp0s/${{ matrix.name }}@${{ steps.push.outputs.digest }}
