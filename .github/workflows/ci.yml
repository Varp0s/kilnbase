name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: core
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          manifest-path: core/Cargo.toml

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json
      - run: npm ci
      - run: npm test

  smoke:
    runs-on: ubuntu-latest
    needs: [rust, python, sdk]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv run kilnbase init
      # Ubuntu 23.10+ forbids user namespaces to unconfined processes; Functions needs them (README).
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build --wait
      - name: health checks
        run: |
          curl -fsS --retry 10 --retry-all-errors --retry-delay 2 localhost:8000/health
          docker compose exec -T auth python -c "import urllib.request; urllib.request.urlopen('http://localhost:9999/health')"
      # Fails fast with the runner's own log; later suites recreate containers and lose it.
      - name: a function runs in its sandbox
        run: |
          set -a; . ./.env; set +a
          curl -fsS localhost:8000/functions/v1/whoami -H "apikey: $KILNBASE_ANON_KEY"             || { docker compose -f docker-compose.yml -f docker-compose.test.yml logs functions; exit 1; }
      # Without the AppArmor exception (as on a host where someone dropped it) the service must
      # refuse to start rather than fail every call.
      - name: functions refuse to start without a working sandbox
        run: |
          set -a; . ./.env; set +a
          set +e
          out=$(timeout 120 docker run --rm -e KILNBASE_JWKS -e KILNBASE_ANON_KEY             --security-opt seccomp=functions-runner/seccomp.json             -v ./tests/functions:/functions:ro ghcr.io/varp0s/kilnbase-functions:dev 2>&1)
          rc=$?
          echo "$out" | tail -5
          [ "$rc" = 1 ] && echo "$out" | grep -q "cannot create a sandbox"
      # Before the e2e suite: test_gen_types_db type-checks generated output with the SDK's tsc.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: npm ci
        working-directory: sdk/js
      - name: end-to-end tests
        env:
          KILNBASE_E2E: "1"
        run: uv run pytest tests/e2e -q
      - name: doctor finds no blocking problems after the suite
        run: uv run kilnbase doctor
      - name: SDK end-to-end tests
        working-directory: sdk/js
        run: npm run test:e2e
      - name: services refuse example secrets
        run: |
          for img in kilnbase-core kilnbase-auth kilnbase-studio kilnbase-functions kilnbase-graphql; do
            if docker run --rm --env-file .env.example ghcr.io/varp0s/$img:dev; then
              echo "$img started with example secrets"; exit 1
            fi
          done
      - if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml logs
