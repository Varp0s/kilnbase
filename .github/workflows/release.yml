name: release

on:
  push:
    tags: ["v*"]
  # The edge channel: main, every night, once CI has passed on it.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge-gate:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci --branch main \
            --commit "$GITHUB_SHA" --event push --limit 1 --json conclusion -q '.[0].conclusion')
          echo "ci on $GITHUB_SHA: ${conclusion:-none}"
          test "$conclusion" = success

  images:
    needs: edge-gate
    # Tags skip the gate; scheduled and manual runs need it to pass.
    if: always() && (needs.edge-gate.result == 'success' || github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: kilnbase-core
            context: core
            dockerfile: core/Dockerfile
          - name: kilnbase-auth
            context: .
            dockerfile: auth/Dockerfile
          - name: kilnbase-postgres
            context: postgres
            dockerfile: postgres/Dockerfile
          - name: kilnbase-studio
            context: .
            dockerfile: studio/Dockerfile
          - name: kilnbase-functions
            context: .
            dockerfile: functions-runner/Dockerfile
          - name: kilnbase-graphql
            context: graphql
            dockerfile: graphql/Dockerfile
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/varp0s/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.event_name != 'push' }}
            type=sha,prefix=edge-,enable=${{ github.event_name != 'push' }}
      - id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
